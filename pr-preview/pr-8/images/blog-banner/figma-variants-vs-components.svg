<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Figma: Variant Vs Components</title>
<desc id="desc">A split comparison of Figma variants and components with button states and reusable component instances.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee9ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#dcefff"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7450f5"/><stop offset="1" stop-color="#4f2fe0"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2676ef"/><stop offset="1" stop-color="#0757dc"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6570a8" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="70" cy="80" r="210" fill="#bba9ff" opacity=".25"/><circle cx="1130" cy="100" r="230" fill="#73baff" opacity=".22"/>
<g filter="url(#shadow)">
  <rect x="55" y="125" width="485" height="475" rx="28" fill="#fff" fill-opacity=".72" stroke="#fff"/>
  <rect x="660" y="125" width="485" height="475" rx="28" fill="#fff" fill-opacity=".72" stroke="#fff"/>
</g>
<g font-family="Arial, sans-serif" font-weight="700">
  <rect x="105" y="160" width="290" height="58" rx="29" fill="url(#purple)"/>
  <text x="145" y="198" fill="#fff" font-size="25">◆ Variants</text>
  <rect x="710" y="160" width="315" height="58" rx="29" fill="url(#blue)"/>
  <text x="750" y="198" fill="#fff" font-size="25">◇ Components</text>
</g>
<g font-family="Arial, sans-serif">
  <rect x="105" y="250" width="385" height="300" rx="18" fill="#f8f7ff" stroke="#8b72f8" stroke-width="2" stroke-dasharray="9 8"/>
  <g font-size="22" font-weight="700">
    <rect x="135" y="280" width="190" height="55" rx="12" fill="url(#purple)"/><text x="184" y="316" fill="#fff">Button</text><text x="355" y="316" fill="#737aa4" font-size="18" font-weight="400">Default</text>
    <rect x="135" y="350" width="190" height="55" rx="12" fill="#b8aaf5"/><text x="184" y="386" fill="#4c39a5">Button</text><text x="355" y="386" fill="#737aa4" font-size="18" font-weight="400">Hover</text>
    <rect x="135" y="420" width="190" height="55" rx="12" fill="#5d3be4"/><text x="184" y="456" fill="#fff">Button</text><text x="355" y="456" fill="#737aa4" font-size="18" font-weight="400">Pressed</text>
    <rect x="135" y="490" width="190" height="55" rx="12" fill="#dce2ef"/><text x="184" y="526" fill="#8c96b1">Button</text><text x="355" y="526" fill="#737aa4" font-size="18" font-weight="400">Disabled</text>
  </g>
  <rect x="710" y="250" width="300" height="150" rx="18" fill="#f8fbff" stroke="#9dbcf4" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="755" y="290" width="210" height="62" rx="14" fill="url(#blue)"/><text x="822" y="330" fill="#fff" font-size="23" font-weight="700">Button</text>
  <path d="M860 402v55M860 457h-125M860 457h125" fill="none" stroke="#7b91d8" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="690" y="480" width="130" height="55" rx="14" fill="#2775ed"/><rect x="835" y="480" width="130" height="55" rx="14" fill="#6944e8"/><rect x="980" y="480" width="130" height="55" rx="14" fill="#19b890"/>
  <g fill="#fff" font-size="18" font-weight="700"><text x="728" y="515">Button</text><text x="873" y="515">Button</text><text x="1018" y="515">Button</text></g>
  <rect x="925" y="275" width="190" height="180" rx="16" fill="#fff" stroke="#dbe2f0"/>
  <g fill="#24365d" font-size="16"><text x="950" y="307" font-weight="700">▣ Button</text><text x="950" y="345" fill="#3658a8">◇ Default</text><text x="950" y="380">◇ Hover</text><text x="950" y="415">◇ Pressed</text><text x="950" y="450">◇ Disabled</text></g>
</g>
<g font-family="Arial, sans-serif" font-weight="700">
  <circle cx="600" cy="365" r="54" fill="#fff" stroke="#e3b9ff" stroke-width="5" filter="url(#shadow)"/><text x="570" y="378" fill="#182033" font-size="31">VS</text>
