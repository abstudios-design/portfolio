</g>
<path d="M540 190 C560 190 560 230 560 245" fill="none" stroke="#7450f5" stroke-width="4"/><path d="M660 190 C640 190 640 230 640 245" fill="none" stroke="#2676ef" stroke-width="4"/>
</svg>